name: Host

on:
  push:
    paths: ["host/**", ".github/workflows/host.yml"]
  workflow_dispatch:

env:
  GST_VERSION: 1.28.8

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4

      - name: Install GStreamer SDK
        shell: pwsh
        run: |
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.exe"
          Invoke-WebRequest $url -OutFile gst.exe
          Start-Process gst.exe -ArgumentList "/S","/complete" -Wait
          $root = "C:\Program Files\gstreamer\1.0\msvc_x86_64"
          "$root\bin" | Out-File -Append $env:GITHUB_PATH
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -Append $env:GITHUB_ENV
          "PKG_CONFIG=$root\bin\pkg-config.exe" | Out-File -Append $env:GITHUB_ENV

      - run: cargo test --release
      - run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: inklink-host-windows
          path: host/target/release/inklink-host.exe

  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: inklink-host-linux
          path: host/target/release/inklink-host
