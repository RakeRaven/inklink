name: InkLink
options:
  bundleIdPrefix: com.rakeraven
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  InkLink:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: InkLink
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: InkLink receives your computer's screen and sends pen input back over the local network.
        NSBonjourServices:
          - _inklink._tcp
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rakeraven.inklink
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
    scheme: {}
